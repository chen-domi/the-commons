services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: the_commons_inventory
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d the_commons_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
