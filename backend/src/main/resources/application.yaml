spring:
  application:
    name: backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/the_commons_inventory}
    username: ${DATABASE_USERNAME:chendomi}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  nlp:
    enabled: ${NLP_ENABLED:false}
    region: ${BEDROCK_REGION:us-east-1}
    model-id: ${BEDROCK_MODEL_ID:}

server:
  forward-headers-strategy: framework
